spring.application.name=TAHub
spring.datasource.url=jdbc:postgresql://localhost:5433/tahub
spring.datasource.username=tahub
spring.datasource.password=tahub123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Development only. Must be false (or removed) in production.
tahub.demo-data=true

# Link to the university reservation site (shown on the cafeteria page)
tahub.cafeteria.reservation-url=https://food.nit.ac.ir

# Uploaded files (question PDFs, later answers) are kept here, outside the public web folders. Not in git.
tahub.storage.dir=data/files
# The app itself refuses PDFs over 15 MB with a clear message. These limits are higher on purpose:
# if Tomcat refused the upload first, the CSRF token in the same form would be lost and the user would get a bare 403.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
server.tomcat.max-swallow-size=-1
