<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{ta.mine.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <main data-live-topics="ta-requests">
    <h1 th:text="#{ta.mine.title}">My TA requests</h1>

    <!-- Invitations: someone wants this student as a TA -->
    <h2 th:text="#{ta.invitations.title}">Invitations</h2>
    <p th:if="${invitationErrorKey}" th:text="#{${invitationErrorKey}}"></p>
    <p th:if="${#lists.isEmpty(invitations)}" th:text="#{ta.invitations.none}">No invitations.</p>
    <ul th:unless="${#lists.isEmpty(invitations)}">
        <li th:each="i : ${invitations}">
            <a th:href="@{/courses/{id}(id=${i.offering.id})}"
               th:text="${i.offering.course.code} + ' - ' + ${i.offering.course.name}"></a>
            <small th:text="#{ta.invitations.by(${i.invitedBy.fullName})}">invited by</small>
            <form method="post" th:action="@{/ta-invitations/{id}/accept(id=${i.id})}">
                <button type="submit" th:text="#{ta.invitations.accept}">Accept</button>
            </form>
            <form method="post" th:action="@{/ta-invitations/{id}/decline(id=${i.id})}">
                <button type="submit" th:text="#{ta.invitations.decline}">Decline</button>
            </form>
        </li>
    </ul>

    <h2 th:text="#{ta.mine.requestsTitle}">My requests</h2>

    <p th:if="${#lists.isEmpty(applications)}" th:text="#{ta.mine.none}">You have not sent any TA request.</p>

    <table border="1" th:unless="${#lists.isEmpty(applications)}">
        <tr>
            <th th:text="#{ta.requests.course}">Course</th>
            <th th:text="#{ta.mine.semester}">Semester</th>
            <th th:text="#{ta.mine.status}">Status</th>
            <th th:text="#{ta.requests.message}">Message</th>
            <th></th>
        </tr>
        <tr th:each="a : ${applications}">
            <td><a th:href="@{/courses/{id}(id=${a.offering.id})}"
                   th:text="${a.offering.course.code} + ' - ' + ${a.offering.course.name}"></a></td>
            <td th:text="${a.offering.semester.code}"></td>
            <td th:text="#{${'ta.status.' + a.status}}"></td>
            <td th:text="${a.message}"></td>
            <td>
                <form th:if="${a.status.name() == 'PENDING'}" method="post"
                      th:action="@{/ta-applications/{id}/withdraw(id=${a.id})}">
                    <button type="submit" th:text="#{ta.apply.withdraw}">Withdraw request</button>
                </form>
            </td>
        </tr>
    </table>

    <p><a th:href="@{/my-courses}" th:text="#{ta.mine.back}">Back to my courses</a></p>
    </main>
</body>
</html>
