<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{majors.title}">Fields of study</title>
</head>
<body>
<h1 th:text="#{majors.title}">Fields of study</h1>

<p th:if="${#lists.isEmpty(majors)}" th:text="#{majors.empty}">No fields of study yet.</p>

<table border="1" th:unless="${#lists.isEmpty(majors)}">
    <tr>
        <th th:text="#{majors.name}">Name</th>
        <th th:text="#{majors.students}">Students</th>
        <th></th>
    </tr>
    <tr th:each="m : ${majors}">
        <td th:text="${m.name}"></td>
        <td th:text="${usage[m.id]}"></td>
        <td>
            <!-- Only a major that nobody uses can be deleted. -->
            <form th:if="${usage[m.id] == 0}" method="post"
                  th:action="@{/admin/majors/{id}/delete(id=${m.id})}">
                <button type="submit" th:text="#{majors.delete}">Delete</button>
            </form>
        </td>
    </tr>
</table>

<h2 th:text="#{majors.add}">Add a field of study</h2>
<p th:if="${errorKey}" th:text="#{${errorKey}}"></p>

<form method="post" th:action="@{/admin/majors}">
    <label for="name" th:text="#{majors.nameLabel}">Name</label><br>
    <input type="text" id="name" name="name" maxlength="100" required>
    <button type="submit" th:text="#{majors.submit}">Add</button>
</form>

<p><a th:href="@{/}" th:text="#{courses.back}">Back</a></p>
</body>
</html>
