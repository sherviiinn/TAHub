<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{cafeteria.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <main>
        <h1 th:text="#{cafeteria.title}">Cafeteria menu</h1>
        <p th:text="#{cafeteria.week(${weekStart}, ${weekEnd})}">Week</p>

        <p>
            <a th:if="${isNextWeek}" th:href="@{/cafeteria}" th:text="#{cafeteria.thisWeek}">This week</a>
            <a th:unless="${isNextWeek}" th:href="@{/cafeteria(next=true)}" th:text="#{cafeteria.nextWeek}">Next week</a>
            <a th:if="${navIsAdmin}" th:href="@{/admin/cafeteria(next=${isNextWeek})}" th:text="#{cafeteria.edit}">Edit this week</a>
        </p>

        <p>
            <a th:href="${reservationUrl}" target="_blank" rel="noopener noreferrer"
               th:text="#{cafeteria.reserve}">Reserve on the university site</a>
        </p>

        <p th:unless="${hasAnyMeal}" th:text="#{cafeteria.none}">The menu of this week has not been entered yet.</p>

        <!-- Texts and the server clock for static/js/cafeteria.js (it keeps the reservation bars up to date) -->
        <div id="reservation-labels" hidden
             th:attr="data-server-now=${serverNowMillis},
                      data-opens-in=#{cafeteria.reservation.opensIn('{0}')},
                      data-closes-in=#{cafeteria.reservation.closesIn('{0}')},
                      data-closed=#{cafeteria.reservation.closed}"></div>

        <table th:if="${hasAnyMeal}" class="cafeteria-table">
            <thead>
                <tr>
                    <th th:text="#{cafeteria.dayColumn}">Day</th>
                    <th th:each="m : ${mealTypes}" th:text="#{${'cafeteria.meal.' + m.name()}}">Meal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${days}" th:classappend="${d.today} ? 'cafeteria-today' : ''">
                    <td>
                        <strong th:text="#{${d.dayKey}}">Saturday</strong><br>
                        <small th:text="${d.date}"></small>
                        <strong class="tag-new" th:if="${d.today}" th:text="#{cafeteria.today}">Today</strong>

                        <!-- Reservation time of this day: the bar gets shorter and green -> yellow -> red -->
                        <div class="reservation" th:with="r=${d.reservation}"
                             th:attr="data-opens=${r.opensMillis},data-closes=${r.closesMillis}">
                            <div class="reservation-bar">
                                <div class="reservation-fill" th:classappend="${r.color}"
                                     th:style="'width: ' + ${r.percentLeft} + '%'"></div>
                            </div>
                            <small class="reservation-text"
                                   th:if="${r.state.name() == 'BEFORE'}"
                                   th:title="${r.opensText}"
                                   th:text="#{cafeteria.reservation.opensIn(${r.remaining})}">Opens in 1d 2h 3m</small>
                            <small class="reservation-text"
                                   th:if="${r.state.name() == 'OPEN'}"
                                   th:title="${r.closesText}"
                                   th:text="#{cafeteria.reservation.closesIn(${r.remaining})}">Closes in 1d 2h 3m</small>
                            <small class="reservation-text"
                                   th:if="${r.state.name() == 'CLOSED'}"
                                   th:text="#{cafeteria.reservation.closed}">Reservation closed</small>
                        </div>
                    </td>
                    <td th:each="m : ${mealTypes}" th:with="meal=${d.meals.get(m)}">
                        <th:block th:if="${meal != null}">
                            <!-- Two choices: "Food A / Food B". Each name has its own span so it can be styled. -->
                            <span class="food-option" th:text="${meal.option1.name}">Food A</span>
                            <th:block th:if="${meal.option2 != null}">
                                <span class="food-separator"> / </span>
                                <span class="food-option" th:text="${meal.option2.name}">Food B</span>
                            </th:block>
                        </th:block>
                        <span th:if="${meal == null}">-</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <script th:src="@{/js/cafeteria.js}" defer></script>
</body>
</html>
