<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{profReg.title})}"></head>
<body class="auth-page">
<main class="auth">
    <aside th:replace="~{fragments/auth :: aside}"></aside>

    <div class="auth-main">
        <!-- Two soft colour spots behind the card (only decoration) -->
        <span class="auth-blob auth-blob-sky" aria-hidden="true"></span>
        <span class="auth-blob auth-blob-beige" aria-hidden="true"></span>
    <div class="auth-card">
        <!-- A key: this page needs an invite code -->
        <span class="auth-badge" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3"/><path d="M16.5 6.5l2.5 2.5"/><path d="M14 9l2 2"/></svg></span>
        <h1 class="auth-title" th:text="#{profReg.heading}">Professor registration</h1>
        <p class="auth-subtitle" th:text="#{profReg.help}">To create a professor account you need an invite code from an administrator.</p>

        <!--
          err: the message key of the first problem (or empty). Its name tells which field is wrong,
          like "profReg.error.username", so that field is marked and gets the cursor.
        -->
        <form method="post" th:action="@{/register/professor}" class="auth-form" data-busy-form
              th:with="err=${errorKey} ?: '',
                       badCode=${err == 'profReg.error.code'},
                       badName=${#strings.contains(err, 'fullName')},
                       badUsername=${#strings.contains(err, 'username')},
                       badConfirm=${#strings.contains(err, 'passwordMismatch')},
                       badPassword=${#strings.contains(err, 'password') and !#strings.contains(err, 'passwordMismatch')}">
            <div class="field">
                <label for="code" th:text="#{profReg.code}">Invite code</label>
                <input type="text" id="code" name="code" maxlength="30" autocomplete="off" dir="ltr"
                       spellcheck="false" data-ascii-digits class="code-input" th:value="${code}"
                       th:autofocus="${err == '' or badCode}"
                       th:classappend="${badCode} ? 'is-invalid'"
                       th:attr="aria-invalid=${badCode} ? 'true',aria-describedby=${badCode} ? 'profreg-error'">
            </div>
            <div class="field">
                <label for="fullName" th:text="#{register.fullName}">Full name</label>
                <input type="text" id="fullName" name="fullName" maxlength="100" autocomplete="name"
                       th:value="${fullName}"
                       th:autofocus="${badName}"
                       th:classappend="${badName} ? 'is-invalid'"
                       th:attr="aria-invalid=${badName} ? 'true',aria-describedby=${badName} ? 'profreg-error'">
            </div>
            <div class="field">
                <label for="username" th:text="#{profReg.username}">Username</label>
                <input type="text" id="username" name="username" maxlength="30" autocomplete="username" dir="ltr"
                       spellcheck="false" autocapitalize="none" th:value="${username}"
                       th:autofocus="${badUsername}"
                       th:classappend="${badUsername} ? 'is-invalid'"
                       th:attr="aria-invalid=${badUsername} ? 'true',aria-describedby=${badUsername} ? 'profreg-error username-hint' : 'username-hint'">
                <small class="field-hint" id="username-hint" th:text="#{profReg.username.help}">4 to 30 English letters and digits.</small>
            </div>
            <div class="field">
                <label for="password" th:text="#{register.password}">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" autocomplete="new-password"
                           aria-describedby="password-hint"
                           th:autofocus="${badPassword}"
                           th:classappend="${badPassword} ? 'is-invalid'"
                           th:attr="aria-invalid=${badPassword} ? 'true'">
                    <button type="button" class="icon-button password-toggle" data-password-toggle
                            aria-controls="password" aria-pressed="false"
                            th:attr="data-show=#{auth.showPassword},data-hide=#{auth.hidePassword},aria-label=#{auth.showPassword}"
                            th:title="#{auth.showPassword}">
                        <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8"/><path d="M6.6 6.7C3.9 8.4 2.5 12 2.5 12S6 18.5 12 18.5c1.8 0 3.4-.6 4.7-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>
                <small class="field-hint" id="password-hint" th:text="#{register.passwordHint}">8 to 64 characters.</small>
            </div>
            <div class="field">
                <label for="confirmPassword" th:text="#{register.confirmPassword}">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                       th:autofocus="${badConfirm}"
                       th:classappend="${badConfirm} ? 'is-invalid'"
                       th:attr="aria-invalid=${badConfirm} ? 'true',aria-describedby=${badConfirm} ? 'profreg-error'">
            </div>
            <!-- The error sits right above the button; the wrong field is also marked and gets the cursor -->
            <div class="auth-error" role="alert" id="profreg-error" th:if="${errorKey}">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
                <span th:text="#{${errorKey}}">Error</span>
            </div>
            <button type="submit" class="btn-primary btn-block">
                <span class="spinner" aria-hidden="true"></span>
                <span th:text="#{profReg.submit}">Create professor account</span>
            </button>
        </form>

        <p class="auth-switch">
            <a th:href="@{/login}" th:text="#{register.haveAccount}">Already have an account? Sign in</a>
        </p>
        <p class="auth-switch auth-switch-small">
            <a th:href="@{/register}" th:text="#{profReg.studentLink}">Student? Register with your student number</a>
        </p>
    </div>
        <p class="auth-footer" th:text="#{auth.footer}">TA Hub</p>
    </div>
</main>
</body>
</html>
