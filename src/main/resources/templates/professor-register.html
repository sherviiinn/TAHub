<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{profReg.title}">Professor registration</title>
</head>
<body>
<h1 th:text="#{profReg.title}">Professor registration</h1>
<p th:text="#{profReg.help}">You need an invite code from an admin.</p>

<p th:if="${errorKey}" th:text="#{${errorKey}}"></p>

<form method="post" th:action="@{/register/professor}">
    <div>
        <label for="code" th:text="#{profReg.code}">Invite code</label><br>
        <input type="text" id="code" name="code" maxlength="30" autocomplete="off" dir="ltr" th:value="${code}">
    </div>
    <div>
        <label for="fullName" th:text="#{register.fullName}">Full name</label><br>
        <input type="text" id="fullName" name="fullName" maxlength="100" th:value="${fullName}">
    </div>
    <div>
        <label for="username" th:text="#{profReg.username}">Username</label><br>
        <input type="text" id="username" name="username" maxlength="30" autocomplete="username" dir="ltr" th:value="${username}">
        <br><small th:text="#{profReg.username.help}">4 to 30 English letters and digits.</small>
    </div>
    <div>
        <label for="password" th:text="#{register.password}">Password</label><br>
        <input type="password" id="password" name="password" autocomplete="new-password">
    </div>
    <div>
        <label for="confirmPassword" th:text="#{register.confirmPassword}">Confirm password</label><br>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
    </div>
    <button type="submit" th:text="#{profReg.submit}">Create professor account</button>
</form>

<p><a th:href="@{/login}" th:text="#{register.haveAccount}">Already have an account? Sign in</a></p>
</body>
</html>
