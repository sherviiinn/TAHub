<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{announcements.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <main>
        <h1 th:text="#{announcements.title}">Announcements</h1>
        <h2 th:text="${offering.course.code} + ' - ' + ${offering.course.name}">Course</h2>

        <p th:if="${!isCurrentSemester}" th:text="#{announcements.archivedNote}"></p>
        <p th:if="${isCancelled}" th:text="#{course.detail.cancelledBanner}"></p>

        <!-- Professor and TAs: write a new announcement -->
        <div th:if="${canPost}">
            <h2 th:text="#{announcements.new}">New announcement</h2>
            <p th:if="${announcementErrorKey}" th:text="#{${announcementErrorKey}}"></p>

            <form method="post" th:action="@{/courses/{id}/announcements(id=${offering.id})}">
                <label for="title" th:text="#{announcements.titleLabel}">Title</label><br>
                <input type="text" id="title" name="title" maxlength="100" required autocomplete="off"><br>
                <label for="body" th:text="#{announcements.bodyLabel}">Message</label><br>
                <textarea id="body" name="body" rows="6" cols="50" maxlength="2000" required></textarea><br>
                <button type="submit" th:text="#{announcements.post}">Post</button>
            </form>
        </div>

        <p th:if="${#lists.isEmpty(announcements)}" th:text="#{announcements.none}">No announcements yet.</p>

        <article th:each="a : ${announcements}">
            <h3>
                <span th:text="${a.announcement.title}">Title</span>
                <strong class="tag-new" th:if="${a.recent}" th:text="#{announcements.recent}">New</strong>
            </h3>
            <p>
                <small th:text="#{announcements.by(${a.announcement.author.fullName})} + ' - ' + ${a.when}"></small>
            </p>
            <p class="announcement-body" th:text="${a.announcement.body}"></p>
            <form th:if="${a.canDelete}" method="post"
                  th:action="@{/announcements/{aid}/delete(aid=${a.announcement.id})}">
                <button type="submit" th:text="#{announcements.delete}">Delete</button>
            </form>
        </article>

        <p><a th:href="@{/courses/{id}(id=${offering.id})}" th:text="#{announcements.backToCourse}">Back to course</a></p>
    </main>
</body>
</html>
