<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{courses.title}">Courses</title>
</head>
<body>
<h1 th:text="#{courses.title}">Courses</h1>

<p th:if="${semester != null}" th:text="#{courses.semester.current(${semester.code})}"></p>
<p th:if="${semester == null}" th:text="#{courses.noSemester}"></p>

<p th:if="${canCreate}">
    <a th:href="@{/courses/new}" th:text="#{courses.new}">New course</a>
</p>

<p th:if="${#lists.isEmpty(offerings)}" th:text="#{courses.empty}">No courses yet.</p>

<table border="1" th:unless="${#lists.isEmpty(offerings)}">
    <tr>
        <th th:text="#{courses.code}">Code</th>
        <th th:text="#{courses.name}">Name</th>
        <th th:text="#{courses.professor}">Professor</th>
    </tr>
    <tr th:each="o : ${offerings}">
        <td th:text="${o.course.code}"></td>
        <td th:text="${o.course.name}"></td>
        <td th:text="${o.professor.fullName}"></td>
    </tr>
</table>

<p><a th:href="@{/}" th:text="#{courses.back}">Back</a></p>
</body>
</html>
