<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title}">Sign in</title>
</head>
<body>
<h1 th:text="#{login.title}">Sign in</h1>

<p th:if="${param.error}" th:text="#{login.error}"></p>
<p th:if="${param.disabled}" th:text="#{login.disabled}"></p>
<p th:if="${param.logout}" th:text="#{login.logout}"></p>
<p th:if="${param.registered}" th:text="#{login.registered}"></p>

<form method="post" th:action="@{/login}">
    <div>
        <label for="username" th:text="#{login.studentNumber}">Student number or username</label><br>
        <input type="text" id="username" name="username" dir="ltr" required autofocus>
    </div>
    <div>
        <label for="password" th:text="#{login.password}">Password</label><br>
        <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" th:text="#{login.submit}">Sign in</button>
</form>

<p><a th:href="@{/register}" th:text="#{login.register}">Create an account</a></p>
<p><a th:href="@{/register/professor}" th:text="#{login.professor}">Professor? Register with an invite code</a></p>
</body>
</html>
