<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body class="auth-page">
<main class="auth">
    <aside th:replace="~{fragments/auth :: aside}"></aside>

    <div class="auth-main">
        <!-- Two soft colour spots behind the card (only decoration) -->
        <span class="auth-blob auth-blob-sky" aria-hidden="true"></span>
        <span class="auth-blob auth-blob-beige" aria-hidden="true"></span>
    <div class="auth-card">
        <span class="auth-badge" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span>
        <h1 class="auth-title" th:text="#{login.heading}">Welcome back</h1>
        <p class="auth-subtitle" th:text="#{login.subtitle}">Sign in with your student number (or username) to continue.</p>

        <div class="alert alert-success" role="status" th:if="${param.logout}" th:text="#{login.logout}"></div>
        <div class="alert alert-success" role="status" th:if="${param.registered}" th:text="#{login.registered}"></div>

        <!-- Spring Security reads "username" and "password" from this form. -->
        <!--
          Thymeleaf 3.1 forbids request parameters ("param") inside th:attr, so the fields are not
          marked here: data-invalid-if="login-error" lets app.js mark them red when that error box is on the page.
        -->
        <form method="post" th:action="@{/login}" class="auth-form" data-busy-form data-invalid-if="login-error">
            <div class="field">
                <label for="username" th:text="#{login.studentNumber}">Student number or username</label>
                <!-- Students sign in with their number, professors and admins with a username.
                     data-ascii-digits: Persian digits typed here become 0-9 (static/js/app.js) -->
                <input type="text" id="username" name="username" dir="ltr" required autofocus
                       autocomplete="username" autocapitalize="off" spellcheck="false" data-ascii-digits>
            </div>
            <div class="field">
                <label for="password" th:text="#{login.password}">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="icon-button password-toggle" data-password-toggle
                            aria-controls="password" aria-pressed="false"
                            th:attr="data-show=#{auth.showPassword},data-hide=#{auth.hidePassword},aria-label=#{auth.showPassword}"
                            th:title="#{auth.showPassword}">
                        <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8"/><path d="M6.6 6.7C3.9 8.4 2.5 12 2.5 12S6 18.5 12 18.5c1.8 0 3.4-.6 4.7-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>
            </div>
            <!-- Errors sit right above the button, where the user is looking -->
            <div class="auth-error" role="alert" id="login-error" th:if="${param.error}">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
                <span th:text="#{login.error}">Invalid student number (or username) or password.</span>
            </div>
            <!-- A disabled account: the password was right, so the boxes are not marked red -->
            <div class="auth-error" role="alert" th:if="${param.disabled}">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
                <span th:text="#{login.disabled}">This account has been disabled.</span>
            </div>
            <button type="submit" class="btn-primary btn-block">
                <span class="spinner" aria-hidden="true"></span>
                <span th:text="#{login.submit}">Sign in</span>
            </button>
        </form>

        <p class="auth-switch">
            <span th:text="#{login.noAccount}">New to TA Hub?</span>
            <a th:href="@{/register}" th:text="#{login.register}">Create an account</a>
        </p>
        <p class="auth-switch auth-switch-small">
            <a th:href="@{/register/professor}" th:text="#{login.professor}">Professor? Register with an invite code</a>
        </p>
    </div>
        <p class="auth-footer" th:text="#{auth.footer}">TA Hub</p>
    </div>
</main>
</body>
</html>
