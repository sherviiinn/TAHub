<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${appName}">TA Hub</title>
</head>
<body>
<h1 th:text="#{home.welcome(${appName})}">Welcome</h1>
<p th:text="#{home.signedInAs(${fullName}, ${role})}">Signed in as</p>
<p><a th:href="@{/courses}" th:text="#{home.courses}">Courses</a></p>

<p th:if="${isAdmin}">
    <a th:href="@{/users}" th:text="#{home.manageUsers}">Manage users</a>
</p>

<form method="post" th:action="@{/logout}">
    <button type="submit" th:text="#{home.logout}">Sign out</button>
</form>
</body>
</html>
