<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{resources.edit.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <main>
    <h1 th:text="#{resources.edit.title}">Edit resource</h1>
    <h2 th:text="${offering.course.code} + ' - ' + ${offering.course.name}">Course</h2>

    <p th:if="${resourceErrorKey}" class="alert alert-error" th:text="#{${resourceErrorKey}}"></p>

    <form method="post" th:action="@{/resources/{rid}/edit(rid=${resource.id})}">
        <div class="field">
            <label for="title" th:text="#{resources.titleLabel}">Title</label>
            <input type="text" id="title" name="title" maxlength="150" required autocomplete="off" th:value="${title}">
        </div>
        <div class="field">
            <label for="url" th:text="#{resources.urlLabel}">Link</label>
            <input type="url" id="url" name="url" maxlength="500" required autocomplete="off" th:value="${url}">
        </div>
        <div class="field">
            <label for="category" th:text="#{resources.categoryLabel}">Group (optional)</label>
            <input type="text" id="category" name="category" maxlength="100" autocomplete="off" th:value="${category}">
        </div>
        <div class="field">
            <label for="description" th:text="#{resources.descriptionLabel}">Description (optional)</label>
            <input type="text" id="description" name="description" maxlength="300" autocomplete="off" th:value="${description}">
        </div>
        <button type="submit" class="btn-primary" th:text="#{announcements.edit.save}">Save changes</button>
    </form>

    <p><a th:href="@{/courses/{id}/resources(id=${offering.id})}" th:text="#{announcements.edit.cancel}">Cancel</a></p>
    </main>
</body>
</html>
