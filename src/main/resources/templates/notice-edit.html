<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{notices.edit.title})}"></head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <main>
        <h1 th:text="#{notices.edit.title}">Edit notice</h1>

        <p th:if="${noticeErrorKey}" th:text="#{${noticeErrorKey}}"></p>

        <form method="post" th:action="@{/admin/notices/{id}/edit(id=${notice.id})}">
            <label for="title" th:text="#{notices.titleLabel}">Title</label><br>
            <input type="text" id="title" name="title" maxlength="100" required autocomplete="off"
                   th:value="${title}"><br>
            <label for="body" th:text="#{notices.bodyLabel}">Message</label><br>
            <textarea id="body" name="body" rows="6" cols="50" maxlength="2000" required
                      th:text="${body}"></textarea><br>
            <button type="submit" th:text="#{announcements.edit.save}">Save changes</button>
        </form>

        <p><a th:href="@{/notices}" th:text="#{announcements.edit.cancel}">Cancel</a></p>
    </main>
</body>
</html>
