services:
  db:
    image: postgres:16
    container_name: tahub-db
    environment:
      POSTGRES_DB: tahub
      POSTGRES_USER: tahub
      POSTGRES_PASSWORD: tahub123
    ports:
      - "5433:5432"
    volumes:
      - tahub-data:/var/lib/postgresql/data

  ai:
    build: ./ai-service
    container_name: tahub-ai
    env_file:
      - path: ./ai-service/.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ai-service/data:/app/data
    restart: unless-stopped

volumes:
  tahub-data:
